<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no">

<title>Indian Vehicles Simulator 3D</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #87ceeb;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

#top {
    position: fixed;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    z-index: 2;
    color: white;
}

.logo {
    background: #102b20dd;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: bold;
}

select, .button {
    border: 0;
    padding: 11px;
    border-radius: 10px;
    background: #ffffffed;
    color: #17251d;
    font-weight: bold;
}

#speed {
    position: fixed;
    top: 75px;
    right: 12px;
    z-index: 2;
    background: #102b20dd;
    color: white;
    padding: 12px;
    border-radius: 12px;
    font-size: 13px;
}

#controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    padding: 0 18px;
    display: flex;
    justify-content: space-between;
    align-items: end;
    z-index: 2;
    pointer-events: none;
}

.group {
    display: flex;
    gap: 10px;
    pointer-events: auto;
}

.control {
    width: 65px;
    height: 65px;
    border: 2px solid #ffffff99;
    border-radius: 18px;
    color: white;
    background: #102b20dd;
    font-size: 25px;
    font-weight: bold;
    user-select: none;
    -webkit-user-select: none;
}

.control:active {
    background: #218c52;
    transform: scale(.96);
}

#message {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    background: #102b20cc;
    color: white;
    border-radius: 10px;
    padding: 8px 12px;
    white-space: nowrap;
    font-size: 12px;
}

#loading {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #87ceeb;
    color: #173626;
    font-weight: bold;
    z-index: 10;
    text-align: center;
    padding: 20px;
}

@media (max-width: 420px) {
    .control {
        width: 56px;
        height: 58px;
    }

    .logo {
        font-size: 11px;
        padding: 9px;
    }

    select, .button {
        padding: 9px;
        font-size: 12px;
    }
}
</style>
</head>

<body>
<div id="game"></div>

<div id="top">
    <div class="logo">🇮🇳 INDIAN VEHICLE SIMULATOR</div>

    <select id="vehicle" aria-label="गाड़ी चुनें">
        <option value="car">🚗 कार</option>
        <option value="tractor">🚜 ट्रैक्टर</option>
        <option value="truck">🚛 ट्रक</option>
        <option value="bus">🚌 बस</option>
    </select>

    <button class="button" id="camera">📷</button>
</div>

<div id="speed">SPEED: <span id="speedValue">0</span> km/h</div>

<div id="message">गाड़ी चलाने के लिए हरे बटन दबाएँ</div>

<div id="controls">
    <div class="group">
        <button class="control" data-action="left">◀</button>
        <button class="control" data-action="right">▶</button>
    </div>

    <div class="group">
        <button class="control" data-action="brake">▼</button>
        <button class="control" data-action="gas"
        style="background:#168345ee">▲</button>
    </div>
</div>

<div id="loading">3D गेम लोड हो रहा है...<br>कृपया इंटरनेट चालू रखें।</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const loading = document.getElementById('loading');
const game = document.getElementById('game');

let scene, camera, renderer;
let vehicleGroup, wheels = [];
let speed = 0;
let steering = 0;
let cameraMode = 0;
let roadMarks = [];
let trees = [];
let buildings = [];
let lastTime = performance.now();

const keys = {
    gas: false,
    brake: false,
    left: false,
    right: false
};

const types = {
    car: {
        name: 'कार',
        width: 1.8,
        length: 3.7,
        height: 1.15,
        maxSpeed: 38,
        color: 0xd62828
    },
    tractor: {
        name: 'ट्रैक्टर',
        width: 2.0,
        length: 3.0,
        height: 1.8,
        maxSpeed: 24,
        color: 0x168b38
    },
    truck: {
        name: 'ट्रक',
        width: 2.1,
        length: 5.4,
        height: 2.3,
        maxSpeed: 30,
        color: 0xe6a126
    },
    bus: {
        name: 'बस',
        width: 2.1,
        length: 5.8,
        height: 2.5,
        maxSpeed: 32,
        color: 0x246bd1
    }
};

let selected = 'car';

function material(color, roughness = 0.9) {
    return new THREE.MeshStandardMaterial({
        color,
        roughness
    });
}

function box(parent, w, h, d, color, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material(color)
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
}

function cylinder(parent, radius, height, color, x, y, z) {
    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, 16),
        material(color)
    );

    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    parent.add(mesh);
    return mesh;
}

function makeTree(x, z) {
    const tree = new THREE.Group();

    cylinder(tree, 0.16, 1.6, 0x79502b, 0, 0.8, 0);

    const crown = new THREE.Mesh(
        new THREE.ConeGeometry(1.05, 2.5, 8),
        material([0x238b45, 0x317b32, 0x409b42][
            Math.floor(Math.random() * 3)
        ])
    );

    crown.position.y = 2.55;
    crown.castShadow = true;
    tree.add(crown);

    tree.position.set(x, 0, z);
    scene.add(tree);
    trees.push(tree);
}

function makeHouse(x, z) {
    const house = new THREE.Group();

    box(house, 4.2, 2.5, 3.7, 0xe8c99b, 0, 1.25, 0);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(3.1, 1.6, 4),
        material(0x9e4833)
    );

    roof.rotation.y = Math.PI / 4;
    roof.position.set(0, 3.2, 0);
    roof.scale.set(1, 1, 0.9);
    house.add(roof);

    box(house, 0.9, 1.7, 0.12, 0x6d3c22, 0, 0.85, 1.9);

    box(house, 0.8, 0.7, 0.12, 0x8bd8e8, -1.25, 1.55, 1.9);

    house.position.set(x, 0, z);
    scene.add(house);
    buildings.push(house);
}

function makeRoad() {
    // सड़क और दोनों किनारों की जमीन
    box(scene, 200, 0.1, 2000, 0x69a74a, 0, -0.12, -800);
    box(scene, 10, 0.08, 2000, 0x41464a, 0, -0.03, -800);

    // सड़क के किनारे
    box(scene, 0.13, 0.09, 2000, 0xffffff, -4.65, 0.02, -800);
    box(scene, 0.13, 0.09, 2000, 0xffffff, 4.65, 0.02, -800);

    // बीच की सफेद लाइनें
    for (let z = 15; z > -1900; z -= 12) {
        const mark = box(
            scene, 0.13, 0.035, 5,
            0xffffff, 0, 0.035, z
        );
        roadMarks.push(mark);
    }

    // दूर तक पेड़ और गाँव के घर
    for (let z = 20; z > -1000; z -= 25) {
        makeTree(-7 - Math.random() * 8, z);
        makeTree(7 + Math.random() * 8, z - 10);

        if (z % 100 === 20) {
            makeHouse(-13, z - 25);
            makeHouse(14, z - 50);
        }
    }
}

function makeWheels(parent, width, length, radius) {
    const positions = [
        [-width / 2, radius, -length * 0.31],
        [ width / 2, radius, -length * 0.31],
        [-width / 2, radius,  length * 0.31],
        [ width / 2, radius,  length * 0.31]
    ];

    for (const [x, y, z] of positions) {
        const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, 0.24, 20),
            material(0x202020)
        );

        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(x, y, z);
        wheel.castShadow = true;
        parent.add(wheel);
        wheels.push(wheel);

        const hub = new THREE.Mesh(
            new THREE.CylinderGeometry(radius * 0.42, radius * 0.42, 0.255, 16),
            material(0xaaaaaa)
        );

        hub.rotation.z = Math.PI / 2;
        hub.position.copy(wheel.position);
        parent.add(hub);
    }
}

function createVehicle(type) {
    if (vehicleGroup) {
        scene.remove(vehicleGroup);
    }

    wheels = [];
    selected = type;

    const spec = types[type];
    vehicleGroup = new THREE.Group();

    const w = spec.width;
    const l = spec.length;
    const h = spec.height;

    if (type === 'car') {
        box(vehicleGroup, w, 0.55, l, spec.color, 0, 0.75, 0);

        box(vehicleGroup, w * 0.77, 0.65, l * 0.46,
            0x9bcfe5, 0, 1.30, -0.18);

        box(vehicleGroup, w * 0.85, 0.12, 0.15,
            0xffffff, 0, 0.92, -l / 2 - 0.04);

        box(vehicleGroup, 0.35, 0.2, 0.1,
            0xfff1a6, -0.55, 0.8, -l / 2 - 0.09);

        box(vehicleGroup, 0.35, 0.2, 0.1,
            0xfff1a6, 0.55, 0.8, -l / 2 - 0.09);
    }

    if (type === 'tractor') {
        box(vehicleGroup, 1.8, 0.65, 1.9,
            0x168b38, 0, 1.05, -0.45);

        box(vehicleGroup, 1.3, 1.0, 1.15,
            0x238f40, 0, 1.75, 0.1);

        box(vehicleGroup, 1.35, 0.12, 1.25,
            0x333333, 0, 2.3, 0.1);

        // ट्रॉली
        box(vehicleGroup, 2.0, 0.9, 2.5,
            0x9b3529, 0, 1.0, 2.6);

        box(vehicleGroup, 2.0, 0.12, 2.5,
            0xb94c32, 0, 1.5, 2.6);
    }

    if (type === 'truck') {
        box(vehicleGroup, w, 1.3, 2.0,
            spec.color, 0, 1.0, -1.5);

        box(vehicleGroup, 1.7, 1.25, 1.55,
            0xe4e4e4, 0, 1.65, -2.3);

        box(vehicleGroup, 1.3, 0.55, 0.08,
            0x7fc5e0, 0, 1.95, -3.09);

        box(vehicleGroup, w, 0.8, 2.5,
            0xb2b6b7, 0, 1.7, 1.0);
    }

    if (type === 'bus') {
        box(vehicleGroup, w, 2.0, l,
            spec.color, 0, 1.35, 0);

        for (let z = -2.1; z <= 2.1; z += 0.85) {
            box(vehicleGroup, 0.06, 0.7, 0.6,
                0xa8dce9, -w / 2 - 0.01, 1.75, z);

            box(vehicleGroup, 0.06, 0.7, 0.6,
                0xa8dce9, w / 2 + 0.01, 1.75, z);
        }

        box(vehicleGroup, 1.6, 0.65, 0.1,
            0x9ed9e8, 0, 1.85, -l / 2 - 0.05);
    }

    const radius = type === 'tractor' ? 0.58 :
                   type === 'truck' || type === 'bus' ? 0.43 : 0.34;

    makeWheels(vehicleGroup, w, l, radius);

    vehicleGroup.position.set(0, 0, 0);
    scene.add(vehicleGroup);
}

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 90, 330);

    camera = new THREE.PerspectiveCamera(
        65, window.innerWidth / window.innerHeight, 0.1, 1500
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    game.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x567344, 2));

    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(-40, 80, -20);
    sun.castShadow = true;
    scene.add(sun);

    makeRoad();
    createVehicle('car');

    camera.position.set(0, 5, 10);
    camera.lookAt(0, 1, 0);

    loading.style.display = 'none';

    window.addEventListener('resize', resize);
    requestAnimationFrame(animate);
}

function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(now) {
    requestAnimationFrame(animate);

    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    const spec = types[selected];

    if (keys.gas) {
        speed += 16 * dt;
    } else if (keys.brake) {
        speed -= 25 * dt;
    } else {
        speed *= Math.pow(0.985, dt * 60);
    }

    speed = THREE.MathUtils.clamp(speed, -8, spec.maxSpeed);

    let direction = speed / 3.6;

    if (keys.left) steering = Math.min(steering + 2 * dt, 1);
    else if (keys.right) steering = Math.max(steering - 2 * dt, -1);
    else steering *= Math.pow(0.90, dt * 60);

    vehicleGroup.rotation.y += steering * direction * 0.12 * dt;
    vehicleGroup.translateZ(-direction * dt);

    // दुनिया को गाड़ी के आगे बढ़ने जैसा दिखाना
    const dz = direction * dt;

    for (const mark of roadMarks) {
        mark.position.z += dz;

        if (mark.position.z > 20) {
            mark.position.z -= 1920;
        }
    }

    for (const tree of trees) {
        tree.position.z += dz;

        if (tree.position.z > 35) {
            tree.position.z -= 1050;
        }
    }

    for (const house of buildings) {
        house.position.z += dz;

        if (house.position.z > 40) {
            house.position.z -= 1050;
        }
    }

    const offset = cameraMode === 0
        ? new THREE.Vector3(0, 4.5, 8)
        : new THREE.Vector3(0, 10, 2);

    offset.applyQuaternion(vehicleGroup.quaternion);

    const targetCamera = vehicleGroup.position.clone().add(offset);

    camera.position.lerp(targetCamera, 1 - Math.pow(0.001, dt));
    camera.lookAt(
        vehicleGroup.position.x,
        vehicleGroup.position.y + 1,
        vehicleGroup.position.z - 2
    );

    wheels.forEach(wheel => {
        wheel.rotation.x += direction * dt * 1.8;
    });

    document.getElementById('speedValue').textContent =
        Math.round(Math.abs(speed));

    renderer.render(scene, camera);
}

document.querySelectorAll('[data-action]').forEach(button => {
    const action = button.dataset.action;

    button.addEventListener('pointerdown', event => {
        event.preventDefault();
        keys[action] = true;
        button.setPointerCapture(event.pointerId);
    });

    const release = event => {
        event.preventDefault();
        keys[action] = false;
    };

    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', () => {
        keys[action] = false;
    });
});

document.getElementById('vehicle').addEventListener('change', event => {
    createVehicle(event.target.value);
    document.getElementById('message').textContent =
        types[event.target.value].name + ' तैयार है!';
});

document.getElementById('camera').addEventListener('click', () => {
    cameraMode = (cameraMode + 1) % 2;

    document.getElementById('message').textContent =
        cameraMode === 0 ? 'थर्ड पर्सन कैमरा' : 'ऊपर से कैमरा';
});

window.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp' || event.key === 'w') keys.gas = true;
    if (event.key === 'ArrowDown' || event.key === 's') keys.brake = true;
    if (event.key === 'ArrowLeft' || event.key === 'a') keys.left = true;
    if (event.key === 'ArrowRight' || event.key === 'd') keys.right = true;
});

window.addEventListener('keyup', event => {
    if (event.key === 'ArrowUp' || event.key === 'w') keys.gas = false;
    if (event.key === 'ArrowDown' || event.key === 's') keys.brake = false;
    if (event.key === 'ArrowLeft' || event.key === 'a') keys.left = false;
    if (event.key === 'ArrowRight' || event.key === 'd') keys.right = false;
});

try {
    init();
} catch (error) {
    loading.innerHTML =
        'गेम लोड नहीं हो पाया।<br>इंटरनेट कनेक्शन जाँचें और दोबारा खोलें।';
    console.error(error);
}
</script>
</body>
  </html>
